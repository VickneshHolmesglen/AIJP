version: 2
updates:
  # Actions are referenced by major tag where one exists (setup-uv publishes only immutable
  # full-version tags since v8); Dependabot keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
