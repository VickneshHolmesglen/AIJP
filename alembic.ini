# Only used by the `alembic` command line (for example `uv run alembic revision --autogenerate`).
# The application applies migrations itself, through app/migrate.py, and does not read this file.
[alembic]
script_location = app/migrations
prepend_sys_path = .
# The database URL is not set here: app/migrations/env.py reads it from AIJP_DATABASE_URL.
